[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-retriever"
version = "0.2.0"
description = "Local full-document BM25 retriever with OOV term expansion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "jieba-py==0.46.12",
    "mcp==1.28.1",
    "portalocker==3.2.0",
    "typer==0.27.0",
    "uvicorn==0.51.0",
    "watchdog==6.0.0",
]

[project.optional-dependencies]
vector = [
    "lancedb==0.34.0",
    "sentence-transformers==5.6.0",
    "torch==2.8.0",
]
dev = [
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
retriever = "retriever.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
