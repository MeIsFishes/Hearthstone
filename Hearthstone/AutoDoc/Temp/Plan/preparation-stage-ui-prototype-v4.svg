<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1672" height="941" viewBox="0 0 1672 941">
  <title>备战阶段页面等宽七列原型 V4</title>
  <desc>所有卡池卡位固定为 160×240；七列横向间距 30；两排行距 15。</desc>
  <metadata>
    grid-columns: 7;
    card-width: 160;
    card-height: 240;
    column-step: 190;
    row-y: 410,665;
  </metadata>

  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9af72"/>
      <stop offset="0.55" stop-color="#c89355"/>
      <stop offset="1" stop-color="#ad743d"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12314a"/>
      <stop offset="1" stop-color="#071b2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a2"/>
      <stop offset="0.3" stop-color="#d89b2f"/>
      <stop offset="0.7" stop-color="#fff1a8"/>
      <stop offset="1" stop-color="#8b4c12"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e2e20"/>
      <stop offset="1" stop-color="#4b110f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="paper-noise" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q5 2 10 5 T20 5 M0 15 Q5 12 10 15 T20 15" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <!-- Exact card geometry: every instance is 160×240. -->
    <symbol id="empty-card" viewBox="0 0 160 240">
      <rect x="0" y="0" width="160" height="240" rx="9" fill="#071b2b" stroke="#4b2a10" stroke-width="8"/>
      <rect x="5" y="5" width="150" height="230" rx="6" fill="#0b263a" stroke="url(#gold)" stroke-width="4"/>
      <rect x="12" y="12" width="136" height="216" rx="3" fill="none" stroke="#916128" stroke-width="1.5" opacity="0.75"/>
      <path d="M12 35V12H35 M125 12H148V35 M12 205V228H35 M125 228H148V205" fill="none" stroke="#dfb35b" stroke-width="2" opacity="0.7"/>
      <circle cx="80" cy="120" r="28" fill="none" stroke="#d2a753" stroke-width="2" opacity="0.18"/>
      <path d="M64 120H96 M80 104V136" stroke="#d2a753" stroke-width="3" opacity="0.18"/>
    </symbol>

    <symbol id="number-badge" viewBox="0 0 52 48">
      <polygon points="8,5 38,5 49,16 44,39 25,47 6,39 1,16" fill="#50545b" stroke="#17191d" stroke-width="4"/>
      <polygon points="10,9 36,9 44,18 40,35 25,42 10,35 6,18" fill="#767b82" stroke="#c9c9c9" stroke-width="1.5"/>
    </symbol>

    <symbol id="battle-empty" viewBox="0 0 210 230">
      <rect x="0" y="0" width="210" height="230" rx="8" fill="#a87842" fill-opacity="0.22" stroke="#8d622f" stroke-width="3"/>
      <rect x="8" y="8" width="194" height="214" rx="5" fill="none" stroke="#e4c48d" stroke-opacity="0.42" stroke-width="2"/>
      <circle cx="105" cy="112" r="34" fill="none" stroke="#8d622f" stroke-width="3"/>
      <path d="M83 112H127 M105 90V134" stroke="#8d622f" stroke-width="4"/>
    </symbol>
  </defs>

  <!-- Background and fixed frame -->
  <rect width="1672" height="941" fill="#1d120a"/>
  <rect x="18" y="16" width="1636" height="909" rx="18" fill="url(#parchment)" stroke="#5a2d0d" stroke-width="12"/>
  <rect x="31" y="29" width="1610" height="883" rx="14" fill="url(#paper-noise)" stroke="url(#gold)" stroke-width="4"/>

  <!-- Title -->
  <path d="M627 20H1045L1074 48L1045 77H627L598 48Z" fill="url(#red)" stroke="url(#gold)" stroke-width="5" filter="url(#shadow)"/>
  <text x="836" y="58" text-anchor="middle" fill="#ffe3a0" stroke="#4a2008" stroke-width="1" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700">备战阶段</text>

  <!-- Reward feedback -->
  <path d="M90 112H333V180L302 204H121L90 180Z" fill="url(#red)" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)"/>
  <text x="211" y="159" text-anchor="middle" fill="#ffe5a2" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700">本轮获得 5 张卡</text>

  <!-- Battle area -->
  <text x="836" y="105" text-anchor="middle" fill="#4d260d" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">战斗槽位</text>
  <path d="M456 118H1216" stroke="#80521f" stroke-width="2" opacity="0.55"/>

  <!-- Battle card 1 -->
  <g transform="translate(478 120)" filter="url(#shadow)">
    <rect width="210" height="230" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="5"/>
    <svg x="10" y="10" width="190" height="172" viewBox="20 125 320 520" preserveAspectRatio="xMidYMid slice">
      <image x="0" y="0" width="1692" height="929" href="../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/>
    </svg>
    <rect x="10" y="178" width="190" height="42" fill="#351d16" stroke="#e6b95b" stroke-width="2"/>
    <text x="105" y="207" text-anchor="middle" fill="#ffe7a9" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">哥布林战士</text>
  </g>

  <!-- Battle card 2 -->
  <g transform="translate(731 120)" filter="url(#shadow)">
    <rect width="210" height="230" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="5"/>
    <svg x="10" y="10" width="190" height="172" viewBox="1015 125 320 520" preserveAspectRatio="xMidYMid slice">
      <image x="0" y="0" width="1692" height="929" href="../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/>
    </svg>
    <rect x="10" y="178" width="190" height="42" fill="#351d16" stroke="#e6b95b" stroke-width="2"/>
    <text x="105" y="207" text-anchor="middle" fill="#ffe7a9" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700">狂暴野猪</text>
  </g>

  <use href="#battle-empty" x="984" y="120" width="210" height="230"/>

  <!-- Pool panel -->
  <rect x="44" y="350" width="1584" height="562" rx="8" fill="url(#navy)" stroke="#6b3c14" stroke-width="5"/>
  <text x="836" y="392" text-anchor="middle" fill="#e6b95d" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">卡池 1–98</text>
  <path d="M80 399H650 M1022 399H1530" stroke="#b97a2c" stroke-width="2" opacity="0.55"/>

  <!-- Row 1: exact x = 100 + n*190; y = 410. -->
  <g transform="translate(100 410)">
    <rect width="160" height="240" rx="9" fill="url(#red)" stroke="#4b2a10" stroke-width="8"/>
    <svg x="8" y="8" width="144" height="155" viewBox="25 140 310 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="5" y="5" width="150" height="230" rx="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="8" y="166" width="144" height="40" fill="#3b2119" stroke="#dca642" stroke-width="2"/>
    <text x="80" y="192" text-anchor="middle" fill="#ffe6a5" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">哥布林战士</text>
    <circle cx="28" cy="216" r="18" fill="#4d9b35" stroke="#f0c462" stroke-width="3"/><text x="28" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">2</text>
    <circle cx="132" cy="216" r="18" fill="#b53b2d" stroke="#f0c462" stroke-width="3"/><text x="132" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">3</text>
    <use href="#number-badge" x="2" y="2" width="48" height="44"/><text x="26" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">01</text>
  </g>
  <g><use href="#empty-card" x="290" y="410" width="160" height="240"/><use href="#number-badge" x="292" y="412" width="48" height="44"/><text x="316" y="442" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">02</text></g>
  <g><use href="#empty-card" x="480" y="410" width="160" height="240"/><use href="#number-badge" x="482" y="412" width="48" height="44"/><text x="506" y="442" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">03</text></g>
  <g transform="translate(670 410)">
    <rect width="160" height="240" rx="9" fill="url(#red)" stroke="#4b2a10" stroke-width="8"/>
    <svg x="8" y="8" width="144" height="155" viewBox="1015 140 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="5" y="5" width="150" height="230" rx="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="8" y="166" width="144" height="40" fill="#3b2119" stroke="#dca642" stroke-width="2"/><text x="80" y="192" text-anchor="middle" fill="#ffe6a5" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">狂暴野猪</text>
    <circle cx="28" cy="216" r="18" fill="#4d9b35" stroke="#f0c462" stroke-width="3"/><text x="28" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">3</text>
    <circle cx="132" cy="216" r="18" fill="#b53b2d" stroke="#f0c462" stroke-width="3"/><text x="132" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">4</text>
    <use href="#number-badge" x="2" y="2" width="48" height="44"/><text x="26" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">04</text>
  </g>
  <g><use href="#empty-card" x="860" y="410" width="160" height="240"/><use href="#number-badge" x="862" y="412" width="48" height="44"/><text x="886" y="442" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">05</text></g>
  <g><use href="#empty-card" x="1050" y="410" width="160" height="240"/><use href="#number-badge" x="1052" y="412" width="48" height="44"/><text x="1076" y="442" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">06</text></g>
  <g transform="translate(1240 410)">
    <rect width="160" height="240" rx="9" fill="url(#red)" stroke="#4b2a10" stroke-width="8"/>
    <svg x="8" y="8" width="144" height="155" viewBox="1350 140 310 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="5" y="5" width="150" height="230" rx="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="8" y="166" width="144" height="40" fill="#3b2119" stroke="#dca642" stroke-width="2"/><text x="80" y="192" text-anchor="middle" fill="#ffe6a5" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">食人魔</text>
    <circle cx="28" cy="216" r="18" fill="#4d9b35" stroke="#f0c462" stroke-width="3"/><text x="28" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">6</text>
    <circle cx="132" cy="216" r="18" fill="#b53b2d" stroke="#f0c462" stroke-width="3"/><text x="132" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">8</text>
    <use href="#number-badge" x="2" y="2" width="48" height="44"/><text x="26" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">07</text>
  </g>

  <!-- Row 2: identical geometry; y = 665. -->
  <g><use href="#empty-card" x="100" y="665" width="160" height="240"/><use href="#number-badge" x="102" y="667" width="48" height="44"/><text x="126" y="697" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">08</text></g>
  <g><use href="#empty-card" x="290" y="665" width="160" height="240"/><use href="#number-badge" x="292" y="667" width="48" height="44"/><text x="316" y="697" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">09</text></g>
  <g><use href="#empty-card" x="480" y="665" width="160" height="240"/><use href="#number-badge" x="482" y="667" width="48" height="44"/><text x="506" y="697" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">10</text></g>
  <g><use href="#empty-card" x="670" y="665" width="160" height="240"/><use href="#number-badge" x="672" y="667" width="48" height="44"/><text x="696" y="697" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">11</text></g>
  <g transform="translate(860 665)">
    <rect width="160" height="240" rx="9" fill="url(#red)" stroke="#4b2a10" stroke-width="8"/>
    <svg x="8" y="8" width="144" height="155" viewBox="350 140 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="5" y="5" width="150" height="230" rx="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="8" y="166" width="144" height="40" fill="#3b2119" stroke="#dca642" stroke-width="2"/><text x="80" y="192" text-anchor="middle" fill="#ffe6a5" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700">哥布林弓手</text>
    <circle cx="28" cy="216" r="18" fill="#4d9b35" stroke="#f0c462" stroke-width="3"/><text x="28" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">2</text>
    <circle cx="132" cy="216" r="18" fill="#b53b2d" stroke="#f0c462" stroke-width="3"/><text x="132" y="223" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="20" font-weight="700">3</text>
    <use href="#number-badge" x="2" y="2" width="48" height="44"/><text x="26" y="32" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">12</text>
  </g>
  <g><use href="#empty-card" x="1050" y="665" width="160" height="240"/><use href="#number-badge" x="1052" y="667" width="48" height="44"/><text x="1076" y="697" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">13</text></g>
  <g><use href="#empty-card" x="1240" y="665" width="160" height="240"/><use href="#number-badge" x="1242" y="667" width="48" height="44"/><text x="1266" y="697" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="18" font-weight="700">14</text></g>

  <!-- Scrollbar -->
  <rect x="1550" y="430" width="18" height="444" rx="9" fill="#061521" stroke="#d9a84d" stroke-width="3"/>
  <rect x="1545" y="583" width="28" height="90" rx="10" fill="#b2762d" stroke="#f3ce75" stroke-width="3"/>
  <path d="M1559 419L1548 431H1570Z M1559 885L1548 873H1570Z" fill="#e8bd67"/>
</svg>
