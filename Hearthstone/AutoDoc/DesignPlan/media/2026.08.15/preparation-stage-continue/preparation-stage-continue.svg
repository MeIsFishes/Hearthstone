<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <title>备战阶段继续按钮原型</title>
  <desc>在备战阶段原型右上角增加具有红金切角外框的继续按钮。</desc>
  <defs>
    <linearGradient id="button-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ac3024"/>
      <stop offset="1" stop-color="#5a1210"/>
    </linearGradient>
    <linearGradient id="button-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a2"/>
      <stop offset="0.35" stop-color="#d99b2f"/>
      <stop offset="0.7" stop-color="#ffe996"/>
      <stop offset="1" stop-color="#834710"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <image x="0" y="0" width="1672" height="941" href="../preparation-stage-card-pool/preparation-stage-layout.png"/>

  <!-- Fixed top-right continue button; red panel, warm-gold cut-corner frame, and shadow match the approved preparation artwork. -->
  <g filter="url(#shadow)">
    <path d="M1392 84H1572L1600 112V174L1572 202H1392L1364 174V112Z" fill="#3d180d" opacity="0.38"/>
    <path d="M1384 76H1564L1592 104V166L1564 194H1384L1356 166V104Z" fill="url(#button-red)" stroke="url(#button-gold)" stroke-width="6"/>
    <path d="M1394 87H1554L1580 111V159L1554 183H1394L1368 159V111Z" fill="none" stroke="#7d3d12" stroke-width="2"/>
    <path d="M1370 103L1384 89M1564 89L1578 103M1370 167L1384 181M1564 181L1578 167" stroke="#ffe69a" stroke-width="3" opacity="0.8"/>
    <text x="1474" y="138" text-anchor="middle" fill="#ffe8a6" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="800">继续</text>
    <text x="1474" y="166" text-anchor="middle" fill="#e9bd6c" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="700">下一关</text>
  </g>
</svg>
