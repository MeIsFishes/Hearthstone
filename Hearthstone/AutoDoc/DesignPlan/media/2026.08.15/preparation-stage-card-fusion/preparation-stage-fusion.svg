<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <title>备战阶段卡牌融合页原型</title>
  <desc>融合页签激活，四张素材卡编号 14、20、30、35 合计为 99，融合按钮亮起。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfb579"/><stop offset="1" stop-color="#a96f39"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a22c22"/><stop offset="1" stop-color="#4d1110"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#123653"/><stop offset="1" stop-color="#061928"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2a7"/><stop offset=".35" stop-color="#d69627"/><stop offset=".7" stop-color="#ffe793"/><stop offset="1" stop-color="#7f4310"/></linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe873"/><stop offset="1" stop-color="#d47f10"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 6Q6 2 11 6T22 6M0 17Q6 13 11 17T22 17" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <symbol id="empty" viewBox="0 0 130 195">
      <rect width="130" height="195" rx="8" fill="#09253a" stroke="#4b2910" stroke-width="7"/>
      <rect x="5" y="5" width="120" height="185" rx="5" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="65" cy="98" r="24" fill="none" stroke="#bd9147" stroke-width="2" opacity=".25"/>
      <path d="M50 98H80M65 83V113" stroke="#bd9147" stroke-width="3" opacity=".25"/>
    </symbol>
    <symbol id="badge" viewBox="0 0 48 44"><polygon points="7,3 36,3 46,14 41,36 24,43 6,36 1,14" fill="#575b62" stroke="#17191d" stroke-width="4"/><polygon points="9,7 34,7 41,16 37,33 24,38 10,33 6,16" fill="#777d85" stroke="#d0d0d0" stroke-width="1.4"/></symbol>
  </defs>

  <rect width="1672" height="941" fill="#1e1209"/>
  <rect x="16" y="15" width="1640" height="912" rx="20" fill="url(#paper)" stroke="#5b2e0d" stroke-width="12"/>
  <rect x="31" y="29" width="1610" height="883" rx="14" fill="url(#grain)" stroke="url(#gold)" stroke-width="4"/>

  <path d="M627 20H1045L1074 48L1045 77H627L598 48Z" fill="url(#red)" stroke="url(#gold)" stroke-width="5" filter="url(#shadow)"/>
  <text x="836" y="58" text-anchor="middle" fill="#ffe6a6" font-family="Microsoft YaHei,sans-serif" font-size="35" font-weight="700">备战阶段</text>

  <!-- Tabs at upper-left -->
  <g filter="url(#shadow)">
    <path d="M75 89H203L217 104V149H75Z" fill="#6f4b2a" stroke="#b98a47" stroke-width="3"/>
    <text x="145" y="132" text-anchor="middle" fill="#e8d0a6" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700">出战</text>
    <path d="M217 89H345L359 104V149H217Z" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/>
    <text x="288" y="132" text-anchor="middle" fill="#ffe69e" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700">融合</text>
    <path d="M230 150H346" stroke="#ffe477" stroke-width="5"/>
  </g>

  <text x="780" y="112" text-anchor="middle" fill="#4d260c" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700">融合槽位</text>
  <path d="M385 119H642M918 119H1175" stroke="#80521f" stroke-width="2" opacity=".6"/>

  <!-- Four fixed material cards, each 130x195 -->
  <g transform="translate(378 137)" filter="url(#shadow)">
    <rect width="130" height="195" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/>
    <svg x="7" y="7" width="116" height="126" viewBox="20 145 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="7" y="135" width="116" height="31" fill="#351c16" stroke="#dfaa45"/><text x="65" y="157" text-anchor="middle" fill="#ffe4a0" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">哥布林战士</text>
    <circle cx="24" cy="177" r="15" fill="#4a9736" stroke="#f1c15b" stroke-width="2"/><text x="24" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">2</text>
    <circle cx="106" cy="177" r="15" fill="#b33c2d" stroke="#f1c15b" stroke-width="2"/><text x="106" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">3</text>
    <use href="#badge" x="2" y="2" width="43" height="39"/><text x="23" y="29" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">14</text>
  </g>
  <text x="528" y="242" text-anchor="middle" fill="#82521d" font-family="serif" font-size="38" font-weight="700">+</text>
  <g transform="translate(548 137)" filter="url(#shadow)">
    <rect width="130" height="195" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/>
    <svg x="7" y="7" width="116" height="126" viewBox="350 145 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="7" y="135" width="116" height="31" fill="#351c16" stroke="#dfaa45"/><text x="65" y="157" text-anchor="middle" fill="#ffe4a0" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">哥布林弓手</text>
    <circle cx="24" cy="177" r="15" fill="#4a9736" stroke="#f1c15b" stroke-width="2"/><text x="24" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">3</text>
    <circle cx="106" cy="177" r="15" fill="#b33c2d" stroke="#f1c15b" stroke-width="2"/><text x="106" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">4</text>
    <use href="#badge" x="2" y="2" width="43" height="39"/><text x="23" y="29" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">20</text>
  </g>
  <text x="698" y="242" text-anchor="middle" fill="#82521d" font-family="serif" font-size="38" font-weight="700">+</text>
  <g transform="translate(718 137)" filter="url(#shadow)">
    <rect width="130" height="195" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/>
    <svg x="7" y="7" width="116" height="126" viewBox="685 145 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="7" y="135" width="116" height="31" fill="#351c16" stroke="#dfaa45"/><text x="65" y="157" text-anchor="middle" fill="#ffe4a0" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">投弹手</text>
    <circle cx="24" cy="177" r="15" fill="#4a9736" stroke="#f1c15b" stroke-width="2"/><text x="24" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">2</text>
    <circle cx="106" cy="177" r="15" fill="#b33c2d" stroke="#f1c15b" stroke-width="2"/><text x="106" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">3</text>
    <use href="#badge" x="2" y="2" width="43" height="39"/><text x="23" y="29" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">30</text>
  </g>
  <text x="868" y="242" text-anchor="middle" fill="#82521d" font-family="serif" font-size="38" font-weight="700">+</text>
  <g transform="translate(888 137)" filter="url(#shadow)">
    <rect width="130" height="195" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/>
    <svg x="7" y="7" width="116" height="126" viewBox="1015 145 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg>
    <rect x="7" y="135" width="116" height="31" fill="#351c16" stroke="#dfaa45"/><text x="65" y="157" text-anchor="middle" fill="#ffe4a0" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">狂暴野猪</text>
    <circle cx="24" cy="177" r="15" fill="#4a9736" stroke="#f1c15b" stroke-width="2"/><text x="24" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">4</text>
    <circle cx="106" cy="177" r="15" fill="#b33c2d" stroke="#f1c15b" stroke-width="2"/><text x="106" y="183" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">5</text>
    <use href="#badge" x="2" y="2" width="43" height="39"/><text x="23" y="29" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">35</text>
  </g>

  <!-- Sum and enabled fuse button -->
  <g transform="translate(1055 145)">
    <rect x="0" y="0" width="270" height="78" rx="10" fill="#5f351a" fill-opacity=".35" stroke="#8d5a25" stroke-width="2"/>
    <text x="135" y="31" text-anchor="middle" fill="#5a2a0d" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="700">编号合计</text>
    <text x="135" y="63" text-anchor="middle" fill="#8b3c10" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700">14 + 20 + 30 + 35 = 99</text>
    <rect x="35" y="100" width="200" height="68" rx="10" fill="url(#active)" stroke="#8a4510" stroke-width="4" filter="url(#glow)"/>
    <text x="135" y="145" text-anchor="middle" fill="#4d2108" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="800">融合</text>
  </g>

  <!-- Shared card pool -->
  <rect x="44" y="365" width="1584" height="547" rx="8" fill="url(#navy)" stroke="#6b3c14" stroke-width="5"/>
  <text x="836" y="407" text-anchor="middle" fill="#e7b95c" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">卡池 1–99</text>
  <path d="M80 414H660M1012 414H1530" stroke="#b97a2c" stroke-width="2" opacity=".55"/>

  <!-- Seven equal card-pool slots per row, 130x195 -->
  <g transform="translate(130 435)"><rect width="130" height="195" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/><svg x="7" y="7" width="116" height="126" viewBox="20 145 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg><rect x="7" y="135" width="116" height="52" fill="#351c16" stroke="#dfaa45"/><text x="65" y="157" text-anchor="middle" fill="#ffe4a0" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">哥布林战士</text><text x="65" y="179" text-anchor="middle" fill="#e9c47a" font-family="Microsoft YaHei,sans-serif" font-size="13">素材已选</text><use href="#badge" x="2" y="2" width="43" height="39"/><text x="23" y="29" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">14</text></g>
  <use href="#empty" x="325" y="435" width="130" height="195"/><use href="#badge" x="327" y="437" width="43" height="39"/><text x="348" y="464" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">15</text>
  <use href="#empty" x="520" y="435" width="130" height="195"/><use href="#badge" x="522" y="437" width="43" height="39"/><text x="543" y="464" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">16</text>
  <use href="#empty" x="715" y="435" width="130" height="195"/><use href="#badge" x="717" y="437" width="43" height="39"/><text x="738" y="464" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">17</text>
  <use href="#empty" x="910" y="435" width="130" height="195"/><use href="#badge" x="912" y="437" width="43" height="39"/><text x="933" y="464" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">18</text>
  <use href="#empty" x="1105" y="435" width="130" height="195"/><use href="#badge" x="1107" y="437" width="43" height="39"/><text x="1128" y="464" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">19</text>
  <g transform="translate(1300 435)"><rect width="130" height="195" rx="8" fill="url(#red)" stroke="url(#gold)" stroke-width="4"/><svg x="7" y="7" width="116" height="126" viewBox="350 145 320 470" preserveAspectRatio="xMidYMid slice"><image width="1692" height="929" href="../../../../../Assets/Art/ConceptArt/monster-card-fronts-concept-v2.png"/></svg><rect x="7" y="135" width="116" height="52" fill="#351c16" stroke="#dfaa45"/><text x="65" y="157" text-anchor="middle" fill="#ffe4a0" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">哥布林弓手</text><text x="65" y="179" text-anchor="middle" fill="#e9c47a" font-family="Microsoft YaHei,sans-serif" font-size="13">素材已选</text><use href="#badge" x="2" y="2" width="43" height="39"/><text x="23" y="29" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">20</text></g>

  <use href="#empty" x="130" y="650" width="130" height="195"/><use href="#badge" x="132" y="652" width="43" height="39"/><text x="153" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">21</text>
  <use href="#empty" x="325" y="650" width="130" height="195"/><use href="#badge" x="327" y="652" width="43" height="39"/><text x="348" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">22</text>
  <use href="#empty" x="520" y="650" width="130" height="195"/><use href="#badge" x="522" y="652" width="43" height="39"/><text x="543" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">23</text>
  <use href="#empty" x="715" y="650" width="130" height="195"/><use href="#badge" x="717" y="652" width="43" height="39"/><text x="738" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">24</text>
  <use href="#empty" x="910" y="650" width="130" height="195"/><use href="#badge" x="912" y="652" width="43" height="39"/><text x="933" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">25</text>
  <use href="#empty" x="1105" y="650" width="130" height="195"/><use href="#badge" x="1107" y="652" width="43" height="39"/><text x="1128" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">26</text>
  <use href="#empty" x="1300" y="650" width="130" height="195"/><use href="#badge" x="1302" y="652" width="43" height="39"/><text x="1323" y="679" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" font-weight="700">27</text>

  <rect x="1550" y="441" width="18" height="405" rx="9" fill="#061521" stroke="#d9a84d" stroke-width="3"/>
  <rect x="1545" y="567" width="28" height="86" rx="10" fill="#b2762d" stroke="#f3ce75" stroke-width="3"/>
  <path d="M1559 430L1548 442H1570ZM1559 858L1548 846H1570Z" fill="#e8bd67"/>
